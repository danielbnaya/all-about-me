## 🌱 MyWork

Menghadapi era **Artificial Intelligence**, manusia—terutama rekayasawan—
memiliki peluang besar untuk membangun sistem yang tidak hanya cerdas,
tetapi juga **bermakna dan memberdayakan**.

Portfolio ini merupakan ruang refleksi pribadi sekaligus akademik,
yang merekam proses pembelajaran saya selama perkuliahan,
baik melalui **UTS** maupun **UAS**.

Setiap bagian tidak berdiri sendiri,
melainkan saling terhubung sebagai satu perjalanan utuh:
dari **mengenal diri**, **mengapresiasi relasi**,  
hingga **membangun gagasan dan pengetahuan**.

